<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Nick &amp; Thuraya · Cartagena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar app shell on desktop, top bar + bottom tab bar on phones. Walls of limewashed plaster, bougainvillea accents, cement-tile motif. */
:root{
  --plaster:#F6EEE3;      /* page ground: limewash */
  --surface:#FFFBF6;      /* cards */
  --sunk:#EFE3D4;         /* inputs, tracks */
  --ink:#2A1D18;          /* text */
  --muted:#6E5A50;        /* secondary text */
  --line:#E2D3C2;         /* hairlines */
  --terracotta:#A94B27;   /* primary action */
  --terracotta-ink:#FFF7F0;
  --bougain:#B8226A;      /* highlight / hearts */
  --sage:#5F7350;         /* done / good */
  --ochre:#B07B12;        /* warnings, candle light */
  --alert:#B3261E;
  --tile:#A94B27;
  --shadow:0 1px 2px rgb(42 29 24 / .06), 0 6px 20px rgb(42 29 24 / .06);
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --plaster:#1B1412; --surface:#251C19; --sunk:#30251F; --ink:#F4E9DD; --muted:#BCA898; --line:#3D2F28;
  --terracotta:#E0784F; --terracotta-ink:#1B1412; --bougain:#EE6AA6; --sage:#A5B98F; --ochre:#E6B95A; --alert:#F08A80; --tile:#E0784F;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --plaster:#1B1412; --surface:#251C19; --sunk:#30251F; --ink:#F4E9DD; --muted:#BCA898; --line:#3D2F28;
  --terracotta:#E0784F; --terracotta-ink:#1B1412; --bougain:#EE6AA6; --sage:#A5B98F; --ochre:#E6B95A; --alert:#F08A80; --tile:#E0784F;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark}

html,body{height:100%}
body{background:var(--plaster);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--plaster)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:clamp(1.6rem,1.2rem + 1.5vw,2.2rem)}
h3{font-size:1.2rem}
p{margin:0}
a{color:var(--terracotta)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bougain);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
[hidden]{display:none!important}
#view:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:28px 18px 20px max(18px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.mono{font-family:var(--display);font-style:italic;font-size:1.9rem;line-height:1}
.mono small{display:block;font-family:var(--body);font-style:normal;font-size:.8rem;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;min-height:44px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--terracotta);font-weight:700}
.nav svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:.85rem}
main{min-width:0;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:12px 0;background:var(--plaster);border-bottom:1px solid transparent}
.topbar .mono{font-size:1.35rem;margin-right:auto;display:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.viewer{display:flex;align-items:center;gap:8px;font-size:.85rem;white-space:nowrap}
.viewer select{background:var(--sunk);border:0;border-radius:999px;padding:8px 12px;font-weight:600;min-height:40px}
.tabbar{display:none}
.more-sheet{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:41;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 -10px 30px rgb(0 0 0 / .12)}
.more-sheet a{display:flex;gap:10px;align-items:center;padding:12px;border-radius:8px;background:var(--sunk);text-decoration:none;color:var(--ink);font-weight:600;min-height:48px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar .mono{display:block}
  .topbar .viewer span{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;min-height:52px;cursor:pointer}
  .tabbar [aria-current="page"]{color:var(--terracotta)}
}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--terracotta);border-color:var(--terracotta);color:var(--terracotta-ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.sage{color:var(--sage)} .pill.ochre{color:var(--ochre)} .pill.alert{color:var(--alert)} .pill.pink{color:var(--bougain)} .pill.terra{color:var(--terracotta)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--terracotta);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--terracotta) 25%,transparent)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));align-items:end}
details.add>summary{list-style:none;cursor:pointer;display:inline-flex}
details.add>summary::-webkit-details-marker{display:none}
details.add[open]>summary{margin-bottom:14px}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--terracotta);border-radius:999px}
.bar i.paid{background:var(--sage)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--sunk);font-size:.9rem}
.banner.view{border-left:4px solid var(--ochre)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:8px}
.sec-head p{max-width:60ch}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:clamp(24px,4vw,44px);box-shadow:var(--shadow)}
.hero svg.tiles{position:absolute;inset:0;width:100%;height:100%;opacity:.09;pointer-events:none}
.hero svg.tiles .t{fill:var(--tile)}
.hero-inner{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.names{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(2.6rem,1.6rem + 4.5vw,4.8rem);line-height:1;letter-spacing:-.01em}
.names .amp{color:var(--bougain);font-style:normal}
.where{margin-top:14px;display:flex;gap:8px 16px;flex-wrap:wrap;color:var(--muted)}
.count{text-align:right}
.count b{display:block;font-family:var(--display);font-size:clamp(3rem,2rem + 4vw,5rem);line-height:.9;font-weight:500;color:var(--terracotta)}
@media (max-width:560px){.hero-inner{grid-template-columns:1fr}.count{text-align:left}}

.stat b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
.stat .bar{margin-top:10px}

/* suggestions */
.sugg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.sugg:first-child{border-top:0;padding-top:0}
.sugg .dot{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);color:var(--ochre)}
.sugg[data-tone=alert] .dot{color:var(--alert)}
.sugg[data-tone=tip] .dot{color:var(--sage)}
.sugg h4{margin:0 0 4px;font-size:.98rem}
.sugg p{font-size:.9rem;color:var(--muted);max-width:65ch}
.sugg .row{margin-top:8px}

/* tasks */
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.check:checked{background:var(--sage);border-color:var(--sage)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:2px}
.month{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px}
.month h3{font-size:1.15rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:38px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--plaster);border-color:var(--ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}

/* budget */
.flex-ctl{display:grid;gap:16px}
input[type=range]{width:100%;accent-color:var(--terracotta);min-height:32px}
.total-big{font-family:var(--display);font-size:clamp(2.2rem,1.6rem + 2.4vw,3.2rem);font-weight:500;line-height:1}
.cat{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(110px,150px) auto;gap:10px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .nm{font-weight:600}
.cat .sub{font-size:.8rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.cat .bar{grid-column:2 / -1;height:6px}
.cat input{text-align:right}
.lock[aria-pressed="true"]{color:var(--bougain);background:color-mix(in srgb,var(--bougain) 12%,transparent)}
.cat.off{opacity:.5}
.status-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--sunk);font-weight:600}
.status-line.over{color:var(--alert)} .status-line.ok{color:var(--sage)}
@media (max-width:560px){.cat{grid-template-columns:auto minmax(0,1fr) auto}.cat .amt{grid-column:2 / 3}.cat .del{grid-row:1;grid-column:3}}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}

/* vendors */
.vendor h3{font-family:var(--body);font-size:1.02rem;font-weight:700}
.vendor dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:12px 0 0;font-size:.9rem}
.vendor dt{color:var(--muted)} .vendor dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--sunk)}
.steps i.on{background:var(--terracotta)}

/* inspiration */
.board{columns:3 260px;column-gap:16px}
.idea{break-inside:avoid;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.idea .img{aspect-ratio:4/5;max-width:100%;background-size:cover;background-position:center;position:relative}
.idea .img.tall{aspect-ratio:3/4}
.idea .img.wide{aspect-ratio:4/3}
.idea img{display:block;width:100%;height:auto}
.idea .cap{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.idea .cap b{font-weight:600;line-height:1.3}
.idea .link-art{aspect-ratio:16/9;display:grid;place-items:center;background:var(--sunk);color:var(--muted);gap:6px;text-align:center;padding:16px}
.hearts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.heart{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);min-height:34px}
.heart[aria-pressed="true"]{color:var(--bougain);border-color:color-mix(in srgb,var(--bougain) 50%,transparent);background:color-mix(in srgb,var(--bougain) 10%,transparent)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.heart:disabled{cursor:default}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--bougain);color:var(--bougain)}
/* sample artwork (stand-ins until you add your own photos) */
.art-lights{background:radial-gradient(circle,#FFD98A 0 1.6px,rgb(255 217 138 / .35) 2.4px,transparent 4px) 0 0/26px 22px,radial-gradient(ellipse at 50% 110%,#8A4B35,transparent 60%),linear-gradient(#1E1A33,#4A2F38)}
.art-bougain{background:radial-gradient(circle at 18% 22%,#D6337F 0 13%,transparent 14%),radial-gradient(circle at 34% 12%,#EA5B9C 0 11%,transparent 12%),radial-gradient(circle at 12% 44%,#C2266F 0 12%,transparent 13%),radial-gradient(circle at 30% 36%,#F07AAE 0 9%,transparent 10%),radial-gradient(circle at 52% 8%,#D6337F 0 9%,transparent 10%),linear-gradient(90deg,transparent 62%,#6E3A22 62% 64%,transparent 64%),linear-gradient(#E9B58F,#D88A5E)}
.art-table{background:radial-gradient(circle,#FFCF6B 0 2px,rgb(255 207 107 / .3) 4px,transparent 7px) 0 58%/34px 20px repeat-x,linear-gradient(#2E211C 0 52%,#EFE0C4 52% 66%,#5A7A4E 66% 70%,#2E211C 70%)}
.art-helic{background:radial-gradient(ellipse at 30% 40%,#E2522B 0 12%,transparent 13%),radial-gradient(ellipse at 60% 30%,#F2A33A 0 10%,transparent 11%),radial-gradient(ellipse at 48% 58%,#F4F0E8 0 9%,transparent 10%),radial-gradient(ellipse at 70% 60%,#B8226A 0 9%,transparent 10%),repeating-linear-gradient(120deg,#3F6B45 0 10px,#2F5236 10px 20px)}
.art-doors{background:linear-gradient(#0000 0 12%,rgb(0 0 0 / .18) 12% 14%,#0000 14%),linear-gradient(90deg,#2F7D8C 0 25%,#F2C14E 25% 50%,#C2266F 50% 75%,#E07A52 75%)}
.art-palette{background:linear-gradient(90deg,#A94B27 0 20%,#D6337F 20% 40%,#F4E7D7 40% 60%,#7D8F69 60% 80%,#E6B95A 80%)}
.art-tag{position:absolute;left:10px;top:10px;background:rgb(0 0 0 / .55);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl select{min-height:38px;padding:6px 8px}
.scroll{overflow-x:auto}
@media (max-width:640px){
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:0}
  .tbl td.g-name{grid-column:1 / 2;font-weight:600}
  .tbl td.g-del{grid-column:2;grid-row:1}
  .tbl td.g-wide{grid-column:1 / -1}
}

/* notes */
.note{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .when{font-size:.8rem;color:var(--muted)}

/* modal + toast */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 32px));box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(27 20 18 / .5)}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:14px}
.modal-body textarea{min-height:240px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--plaster);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:861px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){
  .idea,.card{transition:transform .2s ease,box-shadow .2s ease}
  .idea:hover{transform:translateY(-2px)}
  .bar i{transition:width .35s ease}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="tilePat" width="56" height="56" patternUnits="userSpaceOnUse">

/* ---------- state ---------- */
const KEY='nt-cartagena-v1';
let S; try{ S=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!S || S.v!==1) S=seed();
let viewer='Nick', taskFilter='All', ideaFilter='All', ideaSort='new', noteFilter='All', flexBase=null;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); return true }catch(e){ return false } }
const canBudget = () => viewer!=='Planner';
const isCouple = () => viewer!=='Planner';

/* money */
const usdF = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const copF = new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const cmpF = new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1});
function money(usd,short=false){
  if(S.currency==='COP'){ const v=usd*S.rate; return short && Math.abs(v)>=1e6 ? 'COP '+cmpF.format(v) : 'COP '+copF.format(Math.round(v)); }
  return usdF.format(Math.round(usd));
}
const toDisp = usd => S.currency==='COP' ? Math.round(usd*S.rate) : Math.round(usd);
const fromDisp = v => S.currency==='COP' ? (+v||0)/S.rate : (+v||0);
const step = () => S.currency==='COP' ? 10000 : 10;

/* budget math */
const activeEvents = () => new Set(S.events.filter(e=>e.on).map(e=>e.id));
const activeCats = () => { const a=activeEvents(); return S.cats.filter(c=>a.has(c.event)); };
const planned = () => sum(activeCats(),c=>c.amount);
const paidFor = id => sum(S.payments.filter(p=>p.paid && p.cat===id),p=>p.amount);
const paidTotal = () => sum(S.payments.filter(p=>p.paid && activeEvents().has((S.cats.find(c=>c.id===p.cat)||{}).event)),p=>p.amount);
function rebalance(total, base){
  const act=activeCats(); const src = base || Object.fromEntries(act.map(c=>[c.id,c.amount]));
  const locked=act.filter(c=>c.locked), free=act.filter(c=>!c.locked);
  const L=sum(locked,c=>c.amount), U=sum(free,c=>src[c.id]??c.amount);
  const pool=total-L;
  if(pool<0 || !free.length) return false;
  if(U<=0){ free.forEach(c=>c.amount=Math.round(pool/free.length/10)*10); }
  else { free.forEach(c=>{ c.amount=Math.max(0,Math.round((src[c.id]??c.amount)*pool/U/10)*10) }); }
  const diff=pool-sum(free,c=>c.amount);
  const big=free.reduce((a,b)=>b.amount>a.amount?b:a,free[0]); big.amount+=diff;
  return true;
}

/* ---------- suggestions (rules) ---------- */
function suggestions(){
  const out=[], t=todayISO(), total=S.total, plan=planned(), act=activeCats();
  const monthsLeft = daysBetween(t,S.date)/30.4;
  const L=sum(act.filter(c=>c.locked),c=>c.amount);
  if(plan>total+5) out.push({id:'over',tone:'alert',title:`Your plan is ${money(plan-total)} over budget`,body:'Rebalance scales the unlocked categories down to fit. Locked must-haves stay where they are.',act:canBudget()&&{label:'Rebalance to fit',run:'rebalance'}});
  else if(total-plan>5) out.push({id:'under',tone:'tip',title:`${money(total-plan)} isn't assigned to anything yet`,body:'Add it to your buffer, or rebalance to spread it across unlocked categories.',act:canBudget()&&{label:'Add to buffer',run:'toBuffer'}});
  const buf=S.cats.find(c=>c.id==='buffer'); const bp=buf.amount/total;
  if(bp<0.05) out.push({id:'buffer',tone:'warn',title:`Your buffer is ${Math.round(bp*100)}% of the budget`,body:`Planners usually keep 5–10% aside for surprises such as exchange-rate swings, extra guests and tips. 7% would be ${money(total*.07)}.`,act:canBudget()&&{label:'Raise buffer to 7%',run:'buffer7'}});
  if(L/total>0.6) out.push({id:'locked',tone:'warn',title:`${Math.round(L/total*100)}% of the budget is locked`,body:'With this much locked, a lower budget squeezes everything else hard. Unlock a category or two if you need room to cut.'});
  const soon=S.payments.filter(p=>!p.paid && daysBetween(t,p.due)<=30);
  soon.forEach(p=>out.push({id:'pay-'+p.id,tone:daysBetween(t,p.due)<0?'alert':'warn',title:`${esc(p.label)}: ${money(p.amount)} ${daysBetween(t,p.due)<0?'was due':'due'} ${fmtD(p.due,{month:'short',day:'numeric'})}`,body:'Mark it paid in Budget once it goes out, so the totals stay right.',act:{label:'Open budget',run:'go',arg:'budget'}}));
  const overdue=S.tasks.filter(x=>!x.done && x.due<t);
  if(overdue.length) out.push({id:'overdue-'+overdue.length,tone:'warn',title:`${overdue.length} task${overdue.length>1?'s are':' is'} past due`,body:overdue.slice(0,3).map(x=>esc(x.title)).join(' · '),act:{label:'Open checklist',run:'go',arg:'checklist'}});
  if(!S.dateConfirmed) out.push({id:'date',tone:'tip',title:'Pick your exact date inside the Dec–Feb window',body:'Christmas through New Year is peak season in Cartagena, with the highest hotel and flight prices. Mid-January through February is still dry season and usually easier to book.',act:{label:'Set the date',run:'go',arg:'details'}});
  const venueBooked=S.vendors.some(v=>v.cat==='venue'&&v.status>=3);
  if(!venueBooked && monthsLeft<=16) out.push({id:'venue',tone:'warn',title:'Book the hacienda first',body:'The venue fixes your date, capacity and what catering is included. Aim to sign 12–15 months before the wedding.',act:{label:'Open vendors',run:'go',arg:'vendors'}});
  out.push({id:'legal',tone:'tip',title:'Decide on a legal or symbolic ceremony',body:'A civil wedding in Colombia needs apostilled, translated documents filed ahead of time. Many couples marry legally at home and hold a symbolic ceremony in Cartagena.',act:{label:'Add to notes',run:'note',arg:'Question: legal ceremony in Colombia, or legal at home + symbolic in Cartagena?'}});
  if(S.cats.find(c=>c.id==='florals').locked) out.push({id:'flowers',tone:'tip',title:'Flowers go further in Colombia',body:'Colombia is one of the world\'s largest flower exporters, so roses and carnations are good value. Heliconias, orchids and bougainvillea suit a hacienda courtyard.'});
  out.push({id:'iva',tone:'tip',title:'Check that quotes include IVA',body:'Colombia charges 19% IVA (VAT) on many services. Ask each vendor to confirm "IVA incluido" so your numbers hold.',act:{label:'Add task',run:'task',arg:'Confirm every vendor quote includes IVA'}});
  out.push({id:'sunset',tone:'tip',title:'Plan a late-afternoon ceremony',body:'Midday in Cartagena is hot. A ceremony around 4:30 pm lands in golden hour, and your soft lights take over after sunset, close to 6 pm.'});
  out.push({id:'hora',tone:'tip',title:'Add a hora loca',body:'A Colombian wedding tradition: a late-night burst of live drums, brass, masks and props. Ask your music vendor if they offer it.'});
  const per=total/S.guests;
  out.push({id:'pp-'+S.guests+'-'+total,tone:'tip',title:`${money(per)} per guest at ${S.guests} guests`,body:`At 30 guests that is ${money(total/30)}, and at 50 it is ${money(total/50)}. Catering and bar scale with headcount, so ask vendors for per-person quotes.`});
  return out.filter(s=>!S.dismissed.includes(s.id));
}
function suggHTML(list){
  return list.map(s=>`<div class="sugg" data-tone="${s.tone}">
    <span class="dot">${ic(s.tone==='tip'?'spark':'warn',18)}</span>

    <button class="icon-btn" data-act="dismiss" data-id="${esc(s.id)}" aria-label="Dismiss suggestion">${ic('x',16)}</button>
  </div>`).join('') || '<p class="muted">Nothing to flag right now.</p>';
}

const viewOnly = () => canBudget() ? '' : `<div class="banner view">${ic('lock',18)}<span><b>View only.</b> Your planner can see the budget but only Nick and Thuraya can change it.</span></div>`;

function tilesSVG(){ return `<svg class="tiles" aria-hidden="true"><rect width="100%" height="100%" fill="url(#tilePat)"/></svg>`; }

const V={};

  const t=todayISO(), days=daysBetween(t,S.date), plan=planned(), paid=paidTotal();
  const done=S.tasks.filter(x=>x.done).length;

  const sg=suggestions();
  const loved=S.ideas.filter(i=>i.votes.Nick&&i.votes.Thuraya).slice(0,4);
  return `
  <section class="hero" aria-labelledby="heroNames">${tilesSVG()}
    <div class="hero-inner">
      <div>
        <p class="label">The wedding of</p>

        <div class="where"><span>Cartagena, Colombia</span><span>Hacienda courtyard</span><span>${fmtD(S.date,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} ${S.dateConfirmed?'<span class="pill sage">Confirmed</span>':'<span class="pill ochre">Target date</span>'}</span></div>
      </div>
      <div class="count"><b class="num">${days>0?days:0}</b><span class="label">days to go</span></div>
    </div>

  <div class="grid g3">
    <a class="card stat" href="#budget" data-act="go" data-arg="budget" style="text-decoration:none;color:inherit">
      <p class="label">Budget planned</p><b class="num">${money(plan,true)}</b>
      <p class="muted num" style="font-size:.88rem">of ${money(S.total,true)} · ${money(paid,true)} paid</p>
      <div class="bar" role="img" aria-label="${Math.round(plan/S.total*100)}% of budget planned"><i style="width:${Math.min(100,plan/S.total*100)}%"></i></div>
    </a>
    <a class="card stat" href="#checklist" data-act="go" data-arg="checklist" style="text-decoration:none;color:inherit">
      <p class="label">Checklist</p><b class="num">${done} / ${S.tasks.length}</b>
      <p class="muted" style="font-size:.88rem">tasks done</p>
      <div class="bar" role="img" aria-label="${Math.round(done/S.tasks.length*100)}% of tasks done"><i class="paid" style="width:${done/S.tasks.length*100}%"></i></div>
    </a>
    <a class="card stat" href="#guests" data-act="go" data-arg="guests" style="text-decoration:none;color:inherit">
      <p class="label">Guests</p><b class="num">${S.guests} planned</b>
      <p class="muted num" style="font-size:.88rem">${invited} on the list · ${yes} said yes</p>
      <div class="bar" role="img" aria-label="${yes} of ${S.guests} confirmed"><i class="paid" style="width:${Math.min(100,yes/S.guests*100)}%"></i></div>
    </a>
  </div>

  <div class="grid g2">
    <section class="card" aria-labelledby="sgH">
      <div class="row between" style="margin-bottom:14px"><h3 id="sgH">Suggestions</h3><span class="pill">${sg.length}</span></div>
      ${suggHTML(sg.slice(0,4))}
      ${sg.length>4?`<button class="btn small ghost" data-act="allSugg" style="margin-top:8px">Show all ${sg.length}</button>`:''}
    </section>
    <div class="stack" style="gap:16px">
      <section class="card" aria-labelledby="nxH">
        <div class="row between" style="margin-bottom:6px"><h3 id="nxH">Up next</h3><a href="#checklist" data-act="go" data-arg="checklist" class="btn small ghost">Full checklist</a></div>
        <div>${next.map(taskRow).join('') || '<p class="muted">All caught up.</p>'}</div>
      </section>
      <section class="card" aria-labelledby="pyH">
        <div class="row between" style="margin-bottom:6px"><h3 id="pyH">Upcoming payments</h3></div>
        ${pays.length?pays.map(p=>`<div class="pay"><span>${ic('cal',18)}</span><div><b>${esc(p.label)}</b>${exTag(p)}<div class="t-meta"><span class="${p.due<t?'':'num'}" style="${p.due<t?'color:var(--alert)':''}">${fmtD(p.due)}</span></div></div><b class="num">${money(p.amount)}</b><span></span></div>`).join(''):'<p class="muted">No payments scheduled.</p>'}

  <section class="card" aria-labelledby="viH">
    <div class="row between"><div><p class="label">Our vision</p><h3 id="viH" style="margin-top:4px;font-size:1.5rem;font-style:italic">A hacienda courtyard, soft lights, lots of flowers and color</h3></div><a class="btn small" href="#inspiration" data-act="go" data-arg="inspiration">Open board</a></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));margin-top:16px">

function taskRow(x){
  const t=todayISO(), late=!x.done&&x.due<t;
  return `<div class="task ${x.done?'done':''}">
    <input type="checkbox" class="check" id="tk-${x.id}" data-chg="task" data-id="${x.id}" ${x.done?'checked':''} aria-label="Done: ${esc(x.title)}">
    <div style="min-width:0"><label for="tk-${x.id}" class="t-title" style="cursor:pointer">${esc(x.title)}</label>
      <div class="t-meta"><span style="${late?'color:var(--alert);font-weight:700':''}">${late?'Overdue · ':''}${fmtD(x.due)}</span><span>${esc(x.who)}</span><span>${esc(x.cat)}</span></div></div>
    <button class="icon-btn" data-act="delTask" data-id="${x.id}" aria-label="Delete task: ${esc(x.title)}">${ic('trash',16)}</button>
  </div>`;
}

V.checklist=()=>{
  const f=taskFilter;
  let list=[...S.tasks].sort((a,b)=>a.due.localeCompare(b.due));
  if(['Nick','Thuraya','Planner'].includes(f)) list=list.filter(x=>x.who===f||(x.who==='Both'&&f!=='Planner'));
  if(f==='Open') list=list.filter(x=>!x.done);
  if(f==='Done') list=list.filter(x=>x.done);
  const groups={};
  list.forEach(x=>{ const k=x.due.slice(0,7); (groups[k]=groups[k]||[]).push(x); });
  const done=S.tasks.filter(x=>x.done).length;
  return `
  <div class="sec-head"><div><h2>Checklist</h2><p class="muted">A month-by-month plan for a Cartagena destination wedding, counted back from ${fmtD(S.date)}. Change the date in Wedding details and every task moves with it.</p></div>
    <div class="row"><button class="btn small" data-act="exportTodoist">${ic('download',16)}Todoist CSV</button><button class="btn small" data-act="exportICS">${ic('cal',16)}Calendar (.ics)</button></div></div>
  <div class="card stack">
    <div class="row between"><b class="num">${done} of ${S.tasks.length} done</b><span class="muted num">${Math.round(done/S.tasks.length*100)}%</span></div>
    <div class="bar"><i class="paid" style="width:${done/S.tasks.length*100}%"></i></div>
    <div class="chips" role="group" aria-label="Filter tasks">${['All','Open','Done','Nick','Thuraya','Planner'].map(c=>`<button class="chip" data-act="taskFilter" data-v="${c}" aria-pressed="${f===c}">${c}</button>`).join('')}</div>
    <details class="add"><summary class="btn primary small">${ic('plus',16)}Add task</summary>
      <form data-form="task" class="formgrid">
        <div class="field" style="grid-column:1/-1"><label for="ntTitle">Task</label><input type="text" id="ntTitle" name="title" required placeholder="e.g. Book a boat for the Rosario Islands"></div>
        <div class="field"><label for="ntDue">Due</label><input type="date" id="ntDue" name="due" required value="${todayISO()}"></div>
        <div class="field"><label for="ntWho">Who</label><select id="ntWho" name="who"><option>Both</option><option>Nick</option><option>Thuraya</option><option>Planner</option></select></div>
        <div class="field"><label for="ntCat">Area</label><select id="ntCat" name="cat">${['Planning','Venue','Vendors','Guests','Travel','Florals','Décor','Catering','Music','Attire','Ceremony','Legal','Budget','Events'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <button class="btn primary">Add</button>
      </form></details>
  </div>
  ${Object.keys(groups).length?Object.entries(groups).map(([k,items])=>{
    const m=Math.round(daysBetween(k+'-15',S.date)/30.4);
    return `<section class="card"><div class="month"><h3>${fmtD(k+'-01',{month:'long',year:'numeric'})}</h3><span class="label">${m>0?m+' months out':m===0?'Wedding month':''}</span></div>${items.map(taskRow).join('')}</section>`;
  }).join(''):'<div class="empty">No tasks match this filter.</div>'}`;
};

V.budget=()=>{
  const plan=planned(), total=S.total, paid=paidTotal(), act=activeCats(), diff=total-plan;
  const L=sum(act.filter(c=>c.locked),c=>c.amount);
  const t=todayISO();
  const evs=S.events;
  const byEvent=evs.filter(e=>e.on).map(e=>({e,cats:S.cats.filter(c=>c.event===e.id)}));
  const dis=canBudget()?'':'disabled';
  return `
  <div class="sec-head"><div><h2>Budget</h2><p class="muted">Lock your must-haves. When the total moves up or down, everything unlocked scales to fit.</p></div></div>
  ${viewOnly()}
  <div class="grid g2">
    <section class="card flex-ctl" aria-labelledby="totH">
      <fieldset ${dis} class="flex-ctl">
        <div><p class="label" id="totH">Total budget</p><div class="total-big num" id="totBig">${money(total)}</div>
          <p class="muted num" style="margin-top:6px" id="perGuest">${money(total/S.guests)} per guest at ${S.guests} guests</p></div>
        <div class="field"><label for="totRange">Adjust total</label>
          <input type="range" id="totRange" min="5000" max="40000" step="250" value="${total}" data-inp="total" aria-valuetext="${money(total)}"></div>
        <div class="row">
          ${[-20,-10,10,20].map(p=>`<button type="button" class="chip" data-act="pct" data-v="${p}">${p>0?'+':''}${p}%</button>`).join('')}
          <span class="field" style="flex:1;min-width:140px"><label for="totNum" class="sr">Exact total in ${S.currency}</label><input type="number" id="totNum" min="0" step="${step()}" value="${toDisp(total)}" data-chg="totalNum"></span>
        </div>
      </fieldset>
      <p class="muted" style="font-size:.85rem">${money(L)} locked across ${act.filter(c=>c.locked).length} must-haves. ${money(total-L)} can flex.</p>
    </section>
    <section class="card stack" aria-labelledby="sumH">
      <h3 id="sumH" class="sr">Summary</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">
        <div><p class="label">Planned</p><b class="num" style="font-size:1.4rem" id="planV">${money(plan)}</b></div>
        <div><p class="label">Paid so far</p><b class="num" style="font-size:1.4rem">${money(paid)}</b></div>
        <div><p class="label">Still to pay</p><b class="num" style="font-size:1.4rem">${money(plan-paid)}</b></div>
        <div><p class="label">Exchange rate</p><b class="num" style="font-size:1.4rem">${copF.format(S.rate)}</b><span class="muted" style="font-size:.8rem"> COP / USD</span></div>
      </div>
      <div id="statusLine" class="status-line ${Math.abs(diff)<=5?'ok':diff<0?'over':''}">${statusText(diff)}</div>
      <div class="field"><p class="label">Events in the budget</p>
        <div class="chips">${evs.map(e=>`<button class="chip" data-act="event" data-id="${e.id}" aria-pressed="${e.on}" ${e.fixed||!canBudget()?'disabled':''}>${e.on?'':ic('plus',14)}${esc(e.name)}</button>`).join('')}</div></div>
    </section>
  </div>

  <section class="card" aria-labelledby="catH">
    <div class="row between" style="margin-bottom:8px"><h3 id="catH">Categories</h3><span class="muted" style="font-size:.85rem">${ic('lock',14)} = must-have</span></div>
    ${byEvent.map(({e,cats})=>`
      ${byEvent.length>1?`<p class="label" style="margin-top:18px">${esc(e.name)}</p>`:''}
      ${cats.map(c=>{ const pd=paidFor(c.id); return `<div class="cat" data-cat="${c.id}">
        <button class="icon-btn lock" data-act="lock" data-id="${c.id}" aria-pressed="${c.locked}" aria-label="${c.locked?'Unlock':'Lock'} ${esc(c.name)}" ${dis}>${ic(c.locked?'lock':'unlock',18)}</button>
        <div style="min-width:0"><div class="nm">${esc(c.name)}</div><div class="sub"><span class="num" data-pct>${(c.amount/total*100).toFixed(1)}%</span>${pd?`<span class="num" style="color:var(--sage)">${money(pd)} paid</span>`:''}${c.locked?'<span style="color:var(--bougain)">Must-have</span>':''}</div></div>
        <div class="amt"><label class="sr" for="amt-${c.id}">${esc(c.name)} amount in ${S.currency}</label><input type="number" id="amt-${c.id}" min="0" step="${step()}" value="${toDisp(c.amount)}" data-chg="amount" data-id="${c.id}" ${dis}></div>
        <button class="icon-btn del" data-act="delCat" data-id="${c.id}" aria-label="Remove ${esc(c.name)}" ${dis||(c.id==='buffer'?'disabled':'')}>${ic('trash',16)}</button>
        <div class="bar" aria-hidden="true"><i style="width:${c.amount?Math.min(100,pd/c.amount*100):0}%" class="paid"></i></div>
      </div>`}).join('')}`).join('')}
    ${canBudget()?`<details class="add" style="margin-top:16px"><summary class="btn small">${ic('plus',16)}Add category</summary>
      <form data-form="cat" class="formgrid">
        <div class="field"><label for="ncName">Name</label><input type="text" id="ncName" name="name" required placeholder="e.g. Videography"></div>
        <div class="field"><label for="ncAmt">Amount (${S.currency})</label><input type="number" id="ncAmt" name="amount" min="0" step="${step()}" required></div>
        <div class="field"><label for="ncEv">Event</label><select id="ncEv" name="event">${evs.filter(e=>e.on).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
        <button class="btn primary">Add</button>
      </form></details>`:''}
  </section>

  <section class="card" aria-labelledby="payH">
    <div class="row between" style="margin-bottom:8px"><h3 id="payH">Payments & deposits</h3><button class="btn small" data-act="exportICS">${ic('cal',16)}Add due dates to calendar</button></div>
    ${sampleBanner(S.payments,'payments')}
    <div style="margin-top:8px">${S.payments.length?[...S.payments].sort((a,b)=>a.due.localeCompare(b.due)).map(p=>`<div class="pay">

      <div style="min-width:0"><label for="py-${p.id}"><b>${esc(p.label)}</b></label>${exTag(p)}<div class="t-meta"><span style="${!p.paid&&p.due<t?'color:var(--alert);font-weight:700':''}">${p.paid?'Paid':'Due'} ${fmtD(p.due)}</span><span>${esc((S.cats.find(c=>c.id===p.cat)||{}).name||'')}</span></div></div>
      <b class="num">${money(p.amount)}</b>
      <button class="icon-btn" data-act="delPay" data-id="${p.id}" aria-label="Delete payment ${esc(p.label)}" ${dis}>${ic('trash',16)}</button></div>`).join(''):'<div class="empty">No payments yet. Add deposits as you book vendors.</div>'}</div>
    ${canBudget()?`<details class="add" style="margin-top:14px"><summary class="btn small">${ic('plus',16)}Add payment</summary>
      <form data-form="pay" class="formgrid">
        <div class="field"><label for="npLabel">What</label><input type="text" id="npLabel" name="label" required placeholder="e.g. Florist deposit"></div>
        <div class="field"><label for="npAmt">Amount (${S.currency})</label><input type="number" id="npAmt" name="amount" min="0" step="${step()}" required></div>
        <div class="field"><label for="npDue">Due date</label><input type="date" id="npDue" name="due" required></div>
        <div class="field"><label for="npCat">Category</label><select id="npCat" name="cat">${act.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <button class="btn primary">Add</button>
      </form></details>`:''}
  </section>

  <section class="card" aria-labelledby="bsH"><h3 id="bsH" style="margin-bottom:12px">Budget suggestions</h3>${suggHTML(suggestions().filter(s=>['over','under','buffer','locked','iva','flowers'].includes(s.id)||s.id.startsWith('pay-')||s.id.startsWith('pp-')))}</section>`;
};
function statusText(diff){
  if(Math.abs(diff)<=5) return `${ic('spark',18)} Planned spend matches your total.`;
  if(diff<0) return `${ic('warn',18)} Over by ${money(-diff)}. ${canBudget()?'<button class="btn small" data-act="sugg" data-run="rebalance">Rebalance to fit</button>':''}`;
  return `${money(diff)} not assigned yet. ${canBudget()?'<button class="btn small" data-act="sugg" data-run="toBuffer">Add to buffer</button><button class="btn small ghost" data-act="sugg" data-run="rebalance">Spread it out</button>':''}`;
}
function refreshBudgetNumbers(){
  const total=S.total, plan=planned();
  $('#totBig').textContent=money(total);
  $('#perGuest').textContent=`${money(total/S.guests)} per guest at ${S.guests} guests`;
  $('#totNum').value=toDisp(total);
  $('#totRange').setAttribute('aria-valuetext',money(total));
  $('#planV').textContent=money(plan);
  const sl=$('#statusLine'); const d=total-plan; sl.className='status-line '+(Math.abs(d)<=5?'ok':d<0?'over':''); sl.innerHTML=statusText(d);
  activeCats().forEach(c=>{ const row=document.querySelector(`[data-cat="${c.id}"]`); if(!row) return; row.querySelector('input').value=toDisp(c.amount); row.querySelector('[data-pct]').textContent=(c.amount/total*100).toFixed(1)+'%'; });
}

};

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }

const csvq = v => /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
function todoistCSV(){
  const rows=[['TYPE','CONTENT','DESCRIPTION','PRIORITY','INDENT','AUTHOR','RESPONSIBLE','DATE','DATE_LANG','TIMEZONE','DURATION','DURATION_UNIT','DEADLINE','DEADLINE_LANG']];
  const groups={}; S.tasks.filter(x=>!x.done).sort((a,b)=>a.due.localeCompare(b.due)).forEach(x=>{ const k=fmtD(x.due.slice(0,7)+'-01',{month:'long',year:'numeric'}); (groups[k]=groups[k]||[]).push(x); });
  Object.entries(groups).forEach(([k,items])=>{ rows.push(['section',k,'','','','','','','','','','','','']); items.forEach(x=>rows.push(['task',x.title,`${x.cat} · ${x.who}`,'4','1','','',x.due,'en','America/New_York','','None','',''])); rows.push(Array(14).fill('')); });
  return rows.map(r=>r.map(csvq).join(',')).join('\n');
}
function ics(){
  const st=s=>s.replace(/[,;\\]/g,m=>'\\'+m);
  const ev=(d,title,desc)=>{ const n=parseD(d); n.setDate(n.getDate()+1); return ['BEGIN:VEVENT',`UID:${uid()}@nick-thuraya-wedding`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${isoOf(n).replace(/-/g,'')}`,`SUMMARY:${st(title)}`,`DESCRIPTION:${st(desc)}`,'END:VEVENT'].join('\r\n'); };
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nick & Thuraya//Wedding Planner//EN','CALSCALE:GREGORIAN'];
  out.push(ev(S.date,'Nick & Thuraya’s wedding — Cartagena','Hacienda courtyard'));
  S.payments.filter(p=>!p.paid).forEach(p=>out.push(ev(p.due,`Pay: ${p.label} (${usdF.format(p.amount)})`,'Wedding payment')));
  S.tasks.filter(x=>!x.done).forEach(x=>out.push(ev(x.due,`Wedding: ${x.title}`,`${x.cat} · ${x.who}`)));
  out.push('END:VCALENDAR'); return out.join('\r\n');
}
function budgetCSV(){
  const rows=[['Event','Category','Planned USD','Planned COP','Paid USD','Must-have']];
  activeCats().forEach(c=>rows.push([S.events.find(e=>e.id===c.event).name,c.name,c.amount,Math.round(c.amount*S.rate),paidFor(c.id),c.locked?'Yes':'No']));
  rows.push(['','Total budget',S.total,Math.round(S.total*S.rate),'','']);
  return rows.map(r=>r.map(csvq).join(',')).join('\n');
}

};
function addFiles(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/')); if(!imgs.length) return;
  const title=$('#niTitle')?.value||'', tag=$('#niTag')?.value||'Other';
  let n=0;
  imgs.forEach(file=>{ const r=new FileReader(); r.onload=()=>{ shrink(r.result,1200).then(src=>{ S.ideas.unshift({id:uid(),title:title||file.name.replace(/\.[^.]+$/,''),tag,kind:'image',src,votes:isCouple()?{[viewer]:true}:{},by:viewer}); if(++n===imgs.length){ const ok=save(); render(); toast(ok?`${n} photo${n>1?'s':''} added.`:'Added for this session. The browser is out of space to keep them.'); } }); }; r.readAsDataURL(file); });
}
function shrink(dataUrl,max){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); try{ res(c.toDataURL('image/jpeg',.82)) }catch(e){ res(dataUrl) } }; im.onerror=()=>res(dataUrl); im.src=dataUrl; }); }
function bindDrop(){ const z=$('#dropZone'); if(!z) return;
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.remove('over'); }));
  z.addEventListener('drop',e=>addFiles(e.dataTransfer.files)); }

document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(t && A[t.dataset.act]) A[t.dataset.act](t,e); else if(!e.target.closest('#moreSheet,[data-act="more"]')) { if(!$('#moreSheet').hidden){ $('#moreSheet').hidden=true; navHTML(); } } });
document.addEventListener('change',e=>{ const t=e.target.closest('[data-chg]'); if(t && C[t.dataset.chg]) C[t.dataset.chg](t,e); else if(t && t.dataset.inp && C[t.dataset.inp]) C[t.dataset.inp](t,e); });
document.addEventListener('input',e=>{ const t=e.target.closest('[data-inp]'); if(t && I[t.dataset.inp]) I[t.dataset.inp](t,e); });
document.addEventListener('submit',e=>{ const f=e.target.closest('form[data-form]'); if(f){ e.preventDefault(); F[f.dataset.form](f); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#moreSheet').hidden){ $('#moreSheet').hidden=true; navHTML(); } });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(ROUTES.some(r=>r[0]===h) && h!==route) go(h); });

render();
})();
</script>
